<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ゲーム特集</title>
<style>
:root{--bg:#f6f6f3;--panel:#ffffff;--text:#2a2a2a;--sub:#8b8b86;--line:#e5e4df;--accent:#2a2a2a;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);
  font-family:"Hiragino Sans","BIZ UDPGothic","Yu Gothic UI","Meiryo",sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit}
#menu{max-width:860px;margin:0 auto;padding:48px 16px 56px}
header{text-align:center;margin-bottom:24px}
header h1{margin:0;font-size:clamp(30px,5vw,44px);font-weight:700;letter-spacing:.14em;color:var(--text)}
header p{margin:12px 0 0;color:var(--sub);font-size:14px;letter-spacing:.04em}
header::after{content:"";display:block;width:36px;height:2px;background:var(--text);margin:20px auto 0;opacity:.8}
.tools{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 12px}
.search{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0 14px;height:48px;transition:border-color .15s,box-shadow .15s}
.search:focus-within{border-color:#bdbcb5;box-shadow:0 0 0 4px rgba(0,0,0,.04)}
.search svg{width:18px;height:18px;color:var(--sub);flex:none}
.search input{flex:1;border:0;outline:0;background:transparent;font:inherit;font-size:15px;color:var(--text);min-width:0}
.search input::placeholder{color:#b3b2ac}
.search input::-webkit-search-cancel-button{cursor:pointer}
.search kbd{font-family:inherit;font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:6px;padding:1px 7px;flex:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 14px;font-size:13px;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.chip span{margin-left:6px;color:var(--sub);font-size:11px}
.chip:hover{border-color:#cfcec8}
.chip.on{background:var(--text);border-color:var(--text);color:#fff}
.chip.on span{color:rgba(255,255,255,.6)}
.listhead{font-size:12px;color:var(--sub);padding:2px 4px 8px}
.list{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.list:empty{display:none}
.row{display:flex;align-items:center;gap:14px;width:100%;border:0;border-top:1px solid var(--line);background:none;text-align:left;padding:14px 18px;cursor:pointer;animation:pop .3s both;transition:background .12s}
.row:first-child{border-top:0}
.row:hover{background:#faf9f6}
.row .no{width:20px;font-size:12px;color:var(--sub);flex:none}
.row .emo{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;line-height:1;flex:none;background:color-mix(in srgb,var(--c1) 16%,#fff)}
.row .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.row .nm{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row .ds{font-size:13px;color:#6b6b64;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tag{font-weight:500;font-size:11px;color:color-mix(in srgb,var(--c2) 80%,#000);background:color-mix(in srgb,var(--c1) 12%,#fff);padding:2px 9px;border-radius:99px}
.row .bs{flex:none;text-align:right;font-weight:700;font-size:15px;min-width:52px}
.row .bs small{display:block;font-size:10px;color:var(--sub);font-weight:400}
.row .go{color:#c4c3bd;font-size:22px;flex:none;transition:transform .15s,color .15s}
.row:hover .go{transform:translateX(3px);color:var(--text)}
#empty{text-align:center;padding:48px 16px;color:var(--sub);background:var(--panel);border:1px solid var(--line);border-radius:14px;font-size:14px}
#empty button{margin-top:14px;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:8px 18px;font-size:13px;cursor:pointer}
#empty button:hover{background:#efeeea}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (max-width:560px){.row .no,.search kbd{display:none}.row{padding:12px 14px;gap:12px}
  .row .ds{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}}
footer{text-align:center;color:var(--sub);font-size:12px;margin-top:40px}

#game{display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:12px 16px 16px}
.bar{width:100%;max-width:960px;display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.bar button{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:14px;cursor:pointer}
.bar button:hover{background:#efeeea}
#gtitle{font-weight:700;font-size:18px;flex:1;text-align:center;white-space:nowrap;letter-spacing:.04em}
.sc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 14px;font-size:13px;color:var(--sub);white-space:nowrap}
.sc b{color:var(--text);font-size:17px}
#stage{position:relative;margin-top:14px;border-radius:14px;overflow:hidden;border:1px solid var(--line);box-shadow:0 12px 32px rgba(0,0,0,.08);line-height:0;background:#fff}
canvas{display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:rgba(255,255,255,.86);backdrop-filter:blur(4px);text-align:center;padding:16px;line-height:1.7;cursor:pointer}
#ov h2{margin:0;font-size:clamp(22px,4.5vw,32px);color:var(--text);letter-spacing:.06em}
#ov p{margin:0;color:#5c5c56;font-size:14px;max-width:420px}
#ov p small{color:var(--sub);font-size:12px}
#ov p b{color:var(--text);font-size:26px}
#ov .nb{color:#c2410c;font-weight:600}
#ovB{margin-top:8px;border:0;border-radius:99px;padding:11px 32px;font-size:16px;font-weight:600;cursor:pointer;color:#fff;background:var(--text);letter-spacing:.06em}
#ovB:hover{background:#444}
#ovB:active{transform:translateY(1px)}
#ov .hint{font-size:12px;color:var(--sub)}
#pad{display:none;gap:10px;margin-top:14px;flex-wrap:wrap;justify-content:center}
body.touch #pad.has{display:flex}
#pad button{min-width:64px;height:56px;padding:0 14px;font-size:20px;font-weight:600;border-radius:14px;border:1px solid var(--line);
  background:var(--panel);box-shadow:0 2px 0 #e2e1dc;touch-action:none;user-select:none;-webkit-user-select:none}
#pad button:active{transform:translateY(2px);box-shadow:none;background:#efeeea}
#help{color:var(--sub);font-size:12px;margin:12px 0 0;text-align:center;line-height:1.7}
</style>
</head>
<body>
<div id="menu">
  <header>
    <h1>ゲーム特集</h1>
    <p>ブラウザですぐ遊べる 10本のミニゲーム詰め合わせ</p>
  </header>
  <div class="tools">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="ゲームを検索（例：パズル、ボール、ジャンプ）" autocomplete="off" aria-label="ゲームを検索">
      <kbd>/</kbd>
    </label>
    <div class="chips" id="chips" role="group" aria-label="ジャンルで絞り込み"></div>
  </div>
  <div class="listhead" id="count"></div>
  <div class="list" id="list"></div>
  <div id="empty" hidden>条件に合うゲームが見つかりませんでした<br><button id="clear" type="button">条件をクリア</button></div>
  <footer>ベストスコアはこのブラウザに保存されます ／ ゲーム中は Esc でメニューへ戻れます</footer>
</div>

<div id="game" hidden>
  <div class="bar">
    <button id="back" type="button">← もどる</button>
    <div id="gtitle"></div>
    <div class="sc">スコア <b id="score">0</b>　ベスト <b id="best">0</b></div>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="ov"><h2 id="ovT"></h2><p id="ovM"></p><button id="ovB" type="button">スタート</button><div class="hint">スペース / Enter でも開始</div></div>
  </div>
  <div id="pad"></div>
  <p id="help"></p>
</div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const FONT='"Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic UI","Meiryo",sans-serif';
function rr(c,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function T(c,s,x,y,size,col,al,stroke){c.font=`bold ${size}px ${FONT}`;c.textAlign=al||'center';c.textBaseline='middle';
  if(stroke){c.lineWidth=stroke;c.strokeStyle='rgba(0,0,0,.45)';c.lineJoin='round';c.strokeText(s,x,y);}c.fillStyle=col;c.fillText(s,x,y);}

let G=null,state='menu',score=0,best=0;
const store={get(k){try{return +localStorage.getItem(k)||0}catch(e){return 0}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const api={
  setScore(s){score=s;$('#score').textContent=s;},
  addScore(n){api.setScore(score+n);},
  over(title){
    if(state!=='play')return true;
    state='over';let nb=false;
    if(score>best){best=score;store.set('gtoku_best_'+G.id,best);$('#best').textContent=best;nb=true;}
    showOv(title||'ゲームオーバー',`スコア <b>${score}</b>`+(nb?'<br><span class="nb">🎉 ベスト更新！</span>':''),'もう一度あそぶ');
    return true;
  },
  win(title){return api.over(title||'クリア！');}
};

/* =====================================================================
   ゲーム定義
   reset(api) / update(dt) / draw(ctx) / key(code,down,repeat) / pointer(type,x,y,e)
   ===================================================================== */
const GAMES=[

/* ---------- 1. ふわふわバード ---------- */
{id:'flap',name:'ふわふわバード',emoji:'🐤',tag:'アクション',color:['#4fc3f7','#1e78d6'],
 desc:'タップで羽ばたいて、パイプのすき間をくぐり抜けよう。',
 help:'スペース / ↑ / クリック / タップで羽ばたく',
 w:360,h:640,keep:true /* 縦長がちょうどいいゲーム */,
 size:1.45, // プレイヤーの大きさ（1.0 = 元の大きさ。見た目と当たり判定の両方に効く）
 reset(api){this.api=api;this.y=280;this.vy=0;this.pipes=[];
   if(!this.snd){this.snd=new Audio(encodeURI('ふわふわばーどドカン1個飛び越え効果音_web.wav'));this.snd.preload='auto';}this.t=1.1;this.gx=0;
   if(!this.bg){this.bg=new Image();this.bg.src=encodeURI('ふわふわばーど背景.png');}
   if(!this.grass){this.grass=new Image();this.grass.src=encodeURI('ふわふわバード草部分.png');}
   if(!this.soil){this.soil=new Image();this.soil.src=encodeURI('ふわふわバード土部分.png');}
   if(!this.chara){this.chara=new Image();this.chara.src=encodeURI('ふわふわばーどキャラ.png');}
   if(!this.nums){this.nums=[...Array(10)].map((_,i)=>{const im=new Image();im.src=''+i+'.png';return im;});}
   this.cl=[0,1,2,3].map(i=>({x:i*110,y:rnd(60,260),s:rnd(.7,1.3)}));},
 onStart(){this.flap();},
 flap(){this.vy=-360;},
 // 土管を1個くぐるたびに鳴らす効果音（sozai フォルダ）
 passSound(){
   if(!this.snd){this.snd=new Audio(encodeURI('ふわふわばーどドカン1個飛び越え効果音_web.wav'));this.snd.preload='auto';}
   const a=this.snd.cloneNode();a.volume=.8;a.play().catch(()=>{});
 },
 key(c,d,rep){if(d&&!rep&&(c==='Space'||c==='ArrowUp'||c==='KeyW'))this.flap();},
 pointer(t){if(t==='down')this.flap();},
 update(dt){
   const GY=550,BX=90;
   this.vy=Math.min(this.vy+1250*dt,620);this.y+=this.vy*dt;this.gx=(this.gx+150*dt)%960;
   this.t+=dt;if(this.t>1.45){this.t=0;const gap=156;this.pipes.push({x:370,top:rnd(70,GY-gap-60),gap,p:false});}
   for(const k of this.cl){k.x-=20*dt*k.s;if(k.x<-90)k.x=400;}
   for(const p of this.pipes){
     p.x-=150*dt;
     if(!p.p&&p.x+68<BX){p.p=true;this.api.addScore(1);this.passSound();}
     const hx=12*this.size,hy=11*this.size;
     if(BX+hx>p.x+2&&BX-hx<p.x+66&&(this.y-hy<p.top||this.y+hy>p.top+p.gap))return this.api.over();
   }
   this.pipes=this.pipes.filter(p=>p.x>-80);
   const gb=13*this.size;if(this.y+gb>GY){this.y=GY-gb;return this.api.over();}
   if(this.y<-30){this.y=-30;this.vy=0;}
 },
 // ドット風の土管：2px単位の縦じま（左がハイライト、右が影）＋濃い紫の輪郭
 pipe(c,x,y,h,top){
   if(h<=0)return;
   x=Math.round(x);y=Math.round(y);h=Math.round(h);
   const U=2,O='#543847',CH=24;
   const body=[[1,O],[1,'#b5ec6f'],[2,'#e0fb8a'],[3,'#9fe15b'],[15,'#74bf2e'],[2,'#5fa525'],[1,'#74bf2e'],[3,'#558022'],[1,'#3f6b18'],[1,O]];
   const cap =[[1,O],[1,'#b5ec6f'],[3,'#e0fb8a'],[3,'#9fe15b'],[17,'#74bf2e'],[2,'#5fa525'],[1,'#74bf2e'],[4,'#558022'],[2,'#3f6b18'],[1,O]];
   const stripes=(arr,x0,y0,hh)=>{let xx=x0;for(const[n,col]of arr){c.fillStyle=col;c.fillRect(xx,y0,n*U,hh);xx+=n*U;}};
   stripes(body,x+3,y,h);                         // 本体（幅60）
   const cy=top?y+h-CH:y;
   stripes(cap,x-2,cy,CH);                        // フチ（幅70）
   c.fillStyle=O;c.fillRect(x-2,cy,70,U);c.fillRect(x-2,cy+CH-U,70,U);
   c.fillStyle='rgba(255,255,255,.28)';c.fillRect(x-2+U,cy+U,70-U*2,U);   // フチ上側の光
   c.fillStyle='rgba(0,0,0,.18)';c.fillRect(x+3+U,top?cy-U:cy+CH,60-U*2,U); // フチ際の影
 },
 draw(c){
   const W=360,GY=550,now=performance.now();
   const bg=this.bg;
   if(bg&&bg.complete&&bg.naturalWidth){
     // 背景画像（ふわふわばーど背景.png）を等倍・固定で、下端を地面に合わせて表示
     const iw=bg.naturalWidth,ih=bg.naturalHeight,top=GY-ih;
     c.fillStyle='#6fc3cc';if(top>0)c.fillRect(0,0,W,top);
     c.imageSmoothingEnabled=false;
     for(let x=0;x<W;x+=iw)c.drawImage(bg,x,top,iw,ih);
     c.imageSmoothingEnabled=true;
   }else{
     const g=c.createLinearGradient(0,0,0,GY);g.addColorStop(0,'#4fc3f7');g.addColorStop(1,'#c8f1ff');c.fillStyle=g;c.fillRect(0,0,W,GY);
     c.fillStyle='rgba(255,255,255,.9)';
     for(const k of this.cl){c.beginPath();c.arc(k.x,k.y,22*k.s,0,7);c.arc(k.x+24*k.s,k.y-10*k.s,26*k.s,0,7);c.arc(k.x+50*k.s,k.y,20*k.s,0,7);c.fill();}
     c.fillStyle='#9bdc8f';c.beginPath();c.moveTo(0,GY);for(let x=0;x<=W;x+=10)c.lineTo(x,GY-34-Math.sin(x/40)*14);c.lineTo(W,GY);c.fill();
   }
   for(const p of this.pipes){this.pipe(c,p.x,0,p.top,true);this.pipe(c,p.x,p.top+p.gap,GY-(p.top+p.gap),false);}
   const gr=this.grass,so=this.soil,ok=im=>im&&im.complete&&im.naturalWidth;
   if(ok(gr)&&ok(so)){
     // 地面：草部分（上）＋土部分（下）をつなげて、土管と同じ速さで横スクロール
     const gh=gr.naturalHeight,sw=so.naturalWidth,sh=so.naturalHeight,off=Math.floor(this.gx);
     c.imageSmoothingEnabled=false;
     for(let x=-(off%gr.naturalWidth);x<W;x+=gr.naturalWidth)c.drawImage(gr,x,GY,gr.naturalWidth,gh);
     for(let x=-(off%sw);x<W;x+=sw){
       let y=GY+gh;c.drawImage(so,x,y,sw,sh);y+=sh;
       // 画面下まで足りない分は土の下側を繰り返して埋める
       while(y<640){const h=Math.min(sh,640-y);c.drawImage(so,0,sh-h,sw,h,x,y,sw,h);y+=h;}
     }
     c.imageSmoothingEnabled=true;
   }else{
     c.fillStyle='#e8dc9b';c.fillRect(0,GY,W,90);c.fillStyle='#7cc35b';c.fillRect(0,GY,W,14);
     c.fillStyle='#62a847';for(let x=-(this.gx%28);x<W+28;x+=28){c.beginPath();c.moveTo(x,GY+14);c.lineTo(x+14,GY+14);c.lineTo(x+22,GY);c.lineTo(x+8,GY);c.fill();}
   }
   // bird
   const ready=state==='ready',y=ready?280+Math.sin(now/250)*8:this.y;
   c.save();c.translate(90,y);c.rotate(ready?0:clamp(this.vy/620,-.45,1.2));c.scale(this.size,this.size);
   const ch=this.chara;
   if(ch&&ch.complete&&ch.naturalWidth){
     // キャラ画像（ふわふわばーどキャラ.png）を半分のサイズで中心に描画
     const w=ch.naturalWidth/2,h=ch.naturalHeight/2;
     c.imageSmoothingEnabled=false;c.drawImage(ch,-w/2,-h/2,w,h);c.imageSmoothingEnabled=true;
     c.restore();
   }else{
   c.fillStyle='#ffd23f';c.beginPath();c.ellipse(0,0,17,14,0,0,7);c.fill();
   c.fillStyle='#fff3b0';c.beginPath();c.ellipse(-2,5,10,7,0,0,7);c.fill();
   const wy=Math.sin(now/(ready?120:55))*4;c.fillStyle='#f5a623';c.beginPath();c.ellipse(-6,1+wy,9,5.5,-.3,0,7);c.fill();
   c.fillStyle='#fff';c.beginPath();c.arc(7,-5,5.5,0,7);c.fill();c.fillStyle='#222';c.beginPath();c.arc(8.6,-5,2.4,0,7);c.fill();
   c.fillStyle='#ff7a3d';c.beginPath();c.moveTo(12,-1);c.lineTo(23,2);c.lineTo(12,6);c.fill();
   c.fillStyle='rgba(255,120,120,.5)';c.beginPath();c.arc(4,3,3,0,7);c.fill();
   c.restore();
   }
   if(state!=='ready')this.drawScore(c,W/2,45);
 },
 // 上のスコア表示（0.png〜9.png のドット数字。読み込めないときは文字で表示）
 numScale:.75,
 drawScore(c,cx,top){
   const ds=String(score).split('').map(n=>this.nums[n]);
   if(!ds.every(im=>im.complete&&im.naturalWidth)){T(c,String(score),cx,72,54,'#fff','center',8);return;}
   const s=this.numScale,gap=3,w=ds.reduce((a,im)=>a+im.naturalWidth*s,0)+gap*(ds.length-1);
   let x=Math.round(cx-w/2);c.save();c.imageSmoothingEnabled=false;
   for(const im of ds){const iw=im.naturalWidth*s;c.drawImage(im,x,top,iw,im.naturalHeight*s);x+=iw+gap;}
   c.restore();
 }
},

/* ---------- 2. ニョロニョロ ---------- */
{id:'snake',name:'ニョロニョロ',emoji:'🐍',tag:'アクション',color:['#7ed957','#23955a'],
 desc:'リンゴを食べてどんどん長くなろう。壁や自分の体にぶつかったらおしまい。',
 help:'矢印キー / WASD / スワイプで方向転換',
 w:640,h:360,
 pad:[['←','ArrowLeft'],['↑','ArrowUp'],['↓','ArrowDown'],['→','ArrowRight']],
 reset(api){this.api=api;this.sn=[{x:10,y:9},{x:9,y:9},{x:8,y:9}];this.dir={x:1,y:0};this.q=[];this.acc=0;this.spd=.13;this.sx=null;this.food();},
 food(){do{this.f={x:ri(0,31),y:ri(0,17)}}while(this.sn.some(s=>s.x===this.f.x&&s.y===this.f.y));},

     c.fillStyle=Math.random()<.5?'#ffb84d':'#ff5e5e';c.beginPath();c.moveTo(x-6,y+16);c.lineTo(x,y+26+rnd(0,6));c.lineTo(x+6,y+16);c.fill();
     c.fillStyle='#7ef9ff';c.beginPath();c.moveTo(x,y-20);c.lineTo(x+18,y+16);c.lineTo(x,y+10);c.lineTo(x-18,y+16);c.closePath();c.fill();
     c.fillStyle='#3a86ff';c.beginPath();c.ellipse(x,y-2,4,7,0,0,7);c.fill();
   }
   T(c,'▲'.repeat(Math.max(0,this.lives)),12,20,15,'#7ef9ff','left');
   T(c,'WAVE '+this.wave,388,20,15,'#a9acd6','right');
   if(this.banner>0&&state==='play'){c.globalAlpha=Math.min(1,this.banner);T(c,'WAVE '+this.wave,200,330,40,'#fff','center',6);c.globalAlpha=1;}
 }
},

/* ---------- 10. もぐらたたき ---------- */
{id:'mole',name:'もぐらたたき',emoji:'🔨',tag:'カジュアル',color:['#9ccc65','#558b2f'],
 desc:'30秒でたくさん叩こう！ 金色は+3点、爆弾を叩くと-5点。',
 help:'クリック / タップで叩く（キーボードなら Q W E / A S D / Z X C）',
 w:800,h:450,
 reset(api){this.api=api;this.time=30;this.h=[...Array(9)].map(()=>({s:0,up:0,t:0,type:0}));this.sp=.4;this.fx=[];this.shake=0;},
 pos(i){return{cx:220+(i%3)*180,cy:165+Math.floor(i/3)*115};},
 whack(i){
   const h=this.h[i],{cx,cy}=this.pos(i);
   if(h.s!==1||h.up<.3)return false;
   h.s=2;const pts=h.type===1?3:h.type===2?-5:1;
   this.api.setScore(Math.max(0,score+pts));
   this.fx.push({x:cx,y:cy-90,t:.8,s:(pts>0?'+':'')+pts,c:pts>0?(pts>1?'#ffd23f':'#fff'):'#ff5e5e'});
   if(h.type===2)this.shake=.35;
   return true;
 },
 key(c,d,rep){if(!d||rep)return;const k=['KeyQ','KeyW','KeyE','KeyA','KeyS','KeyD','KeyZ','KeyX','KeyC'].indexOf(c);if(k>=0)this.whack(k);},
 pointer(t,x,y){if(t!=='down')return;for(let i=0;i<9;i++){const{cx,cy}=this.pos(i);if(Math.abs(x-cx)<50&&y>cy-90&&y<cy+20&&this.whack(i))return;}},
 update(dt){
   this.time-=dt;if(this.time<=0){this.time=0;return this.api.over('タイムアップ！');}
   this.shake=Math.max(0,this.shake-dt);
   this.sp-=dt;
   if(this.sp<=0){
     this.sp=rnd(.3,.7)*(.45+this.time/50);
     const free=this.h.filter(h=>h.s===0);
     if(free.length){const h=free[ri(0,free.length-1)],r=Math.random();h.s=1;h.t=rnd(.6,1.1)*(.55+this.time/60);h.type=r<.12?2:r<.25?1:0;}
   }
   for(const h of this.h){
     if(h.s===1){h.up=Math.min(1,h.up+dt*8);h.t-=dt;if(h.t<=0)h.s=3;}
     else if(h.s===2||h.s===3){if(h.s===2&&h.t>-.25){h.t=Math.min(h.t,0)-dt;continue;}h.up=Math.max(0,h.up-dt*7);if(h.up<=0){h.s=0;h.t=0;}}
   }
   for(const f of this.fx){f.t-=dt;f.y-=40*dt;}this.fx=this.fx.filter(f=>f.t>0);
 },
 mole(c,cx,top,h){
   const hit=h.s===2;
   if(h.type===2){
     const y=top+38;c.fillStyle='#222';c.beginPath();c.arc(cx,y,30,0,7);c.fill();c.fillStyle='rgba(255,255,255,.25)';c.beginPath();c.arc(cx-10,y-10,8,0,7);c.fill();
     c.strokeStyle='#8d6e63';c.lineWidth=4;c.beginPath();c.moveTo(cx+12,y-26);c.quadraticCurveTo(cx+22,y-40,cx+30,y-36);c.stroke();
     c.fillStyle=Math.random()<.5?'#ffd23f':'#ff7a3d';c.beginPath();c.arc(cx+31,y-37,5,0,7);c.fill();
     if(hit)T(c,'💥',cx,y,40,'#fff');
     return;
   }
   const body=h.type===1?'#f5c542':'#8d5a3b',belly=h.type===1?'#fff1b8':'#c99a74';
   c.fillStyle=body;rr(c,cx-38,top,76,120,38);c.fill();
   c.fillStyle=belly;c.beginPath();c.ellipse(cx,top+60,24,22,0,0,7);c.fill();
   if(hit){c.strokeStyle='#222';c.lineWidth=3;for(const s of[-1,1]){const ex=cx+s*13,ey=top+30;c.beginPath();c.moveTo(ex-5,ey-5);c.lineTo(ex+5,ey+5);c.moveTo(ex+5,ey-5);c.lineTo(ex-5,ey+5);c.stroke();}}
   else for(const s of[-1,1]){c.fillStyle='#222';c.beginPath();c.arc(cx+s*13,top+30,5,0,7);c.fill();c.fillStyle='#fff';c.beginPath();c.arc(cx+s*13+1.5,top+28.5,1.8,0,7);c.fill();}
   c.fillStyle='#ff8fab';c.beginPath();c.ellipse(cx,top+46,9,6,0,0,7);c.fill();
   c.fillStyle='rgba(255,120,140,.45)';c.beginPath();c.arc(cx-24,top+44,6,0,7);c.arc(cx+24,top+44,6,0,7);c.fill();
   c.strokeStyle='rgba(0,0,0,.4)';c.lineWidth=1.5;for(const s of[-1,1])for(const k of[-1,1]){c.beginPath();c.moveTo(cx+s*12,top+48+k*3);c.lineTo(cx+s*30,top+46+k*7);c.stroke();}
   if(h.type===1){c.fillStyle='#fff';const tw=Math.sin(performance.now()/90);c.globalAlpha=.6+tw*.4;T(c,'✦',cx+30,top+6,16,'#fff');c.globalAlpha=1;}
   if(hit){c.fillStyle='rgba(255,255,255,.9)';T(c,'★',cx-26,top-6,18,'#ffd23f');T(c,'★',cx+26,top-2,14,'#ffd23f');}
 },
 draw(c){
   c.save();
   if(this.shake>0)c.translate(rnd(-6,6)*this.shake*3,rnd(-6,6)*this.shake*3);
   const g=c.createLinearGradient(0,0,0,450);g.addColorStop(0,'#a5d86f');g.addColorStop(1,'#6fb24a');c.fillStyle=g;c.fillRect(-20,-20,840,490);
   c.fillStyle='rgba(255,255,255,.12)';for(let i=0;i<70;i++){const x=(i*97)%800,y=70+(i*53)%370;c.fillRect(x,y,2,8);c.fillRect(x+4,y+2,2,6);}
   c.fillStyle='rgba(0,0,0,.18)';rr(c,90,18,692,20,10);c.fill();
   c.fillStyle=this.time<10?'#ff5e5e':'#ffd23f';rr(c,92,20,688*this.time/30,16,8);c.fill();
   T(c,'⏰ '+Math.ceil(this.time),16,28,20,'#1b4332','left');
   for(let i=0;i<9;i++){
     const{cx,cy}=this.pos(i),h=this.h[i];
     c.fillStyle='#3b2a1a';c.beginPath();c.ellipse(cx,cy,52,18,0,0,7);c.fill();
     if(h.up>0){c.save();c.beginPath();c.rect(cx-62,cy-150,124,150);c.clip();this.mole(c,cx,cy+12-h.up*86,h);c.restore();}
     c.fillStyle='#8b5a2b';c.beginPath();c.ellipse(cx,cy,52,18,0,0,Math.PI);c.ellipse(cx,cy+4,56,20,0,Math.PI,0,true);c.fill();
   }
   for(const f of this.fx){c.globalAlpha=clamp(f.t/.5,0,1);T(c,f.s,f.x,f.y,30,f.c,'center',6);}c.globalAlpha=1;
   c.restore();
 }
}
];

/* =====================================================================
   フレームワーク
   ===================================================================== */
const cv=$('#cv'),ctx=cv.getContext('2d');
function showOv(t,m,b){$('#ovT').textContent=t;$('#ovM').innerHTML=m;$('#ovB').textContent=b;$('#ov').hidden=false;}
function openGame(id){
  G=GAMES.find(g=>g.id===id);
  view(G);const d=DPR=Math.min(2,window.devicePixelRatio||1);cv.width=G.vw*d;cv.height=G.vh*d;ctx.setTransform(d,0,0,d,0,0);
  best=store.get('gtoku_best_'+G.id);$('#best').textContent=best;api.setScore(0);
  $('#gtitle').textContent=G.emoji+' '+G.name;$('#help').textContent=G.help+'　／　Esc：メニューへ';
  buildPad();G.reset(api);state='ready';
  showOv(G.name,G.desc+'<br><small>'+G.help+'</small>','スタート');
  $('#menu').hidden=true;$('#game').hidden=false;
  if(document.activeElement)document.activeElement.blur();
  scrollTo(0,0);fit();
}
function startPlay(){if(!G||state==='play')return;if(state==='over'){G.reset(api);api.setScore(0);}state='play';$('#ov').hidden=true;if(G.onStart)G.onStart();}
function toMenu(){G=null;state='menu';$('#game').hidden=true;$('#menu').hidden=false;renderMenu();}
$('#ov').addEventListener('click',e=>{e.preventDefault();if(document.activeElement)document.activeElement.blur();startPlay();});
$('#back').onclick=toMenu;

/* 画面比率：keep:true のゲーム以外は 16:9。
   ゲームの設計サイズ(w,h)が16:9でないときは16:9の画面の中央に置き、外側はゲームの端の色をのばしてつなげる */
let DPR=1;
function view(g){
  // 設計サイズは最初に一度だけ控えておく（ゲームによっては this.w / this.h を自分のデータに使うため）
  if(g._dw==null){g._dw=g.w;g._dh=g.h;}const W=g._dw,H=g._dh;
  if(g.keep||Math.abs(W/H-16/9)<.01){g.vw=W;g.vh=H;g.ox=g.oy=0;return;}
  if(W/H<16/9){g.vh=H;g.vw=Math.round(H*16/9);}else{g.vw=W;g.vh=Math.round(W*9/16);}
  g.ox=Math.round((g.vw-W)/2);g.oy=Math.round((g.vh-H)/2);
}
function drawGame(c){
  if(!G.ox&&!G.oy){G.draw(c);return;}
  c.save();c.translate(G.ox,G.oy);c.beginPath();c.rect(0,0,G._dw,G._dh);c.clip();G.draw(c);c.restore();
  const d=DPR,ox=Math.round(G.ox*d),oy=Math.round(G.oy*d),w=Math.round(G._dw*d),h=Math.round(G._dh*d);
  c.save();c.setTransform(1,0,0,1,0,0);c.imageSmoothingEnabled=false;
  if(ox){c.drawImage(cv,ox,oy,1,h,0,oy,ox,h);c.drawImage(cv,ox+w-1,oy,1,h,ox+w,oy,cv.width-ox-w,h);}
  if(oy){c.drawImage(cv,0,oy,cv.width,1,0,0,cv.width,oy);c.drawImage(cv,0,oy+h-1,cv.width,1,0,oy+h,cv.width,cv.height-oy-h);}
  c.restore();
}
function gpos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*G.vw/r.width-G.ox,(e.clientY-r.top)*G.vh/r.height-G.oy];}
[['pointerdown','down'],['pointermove','move'],['pointerup','up'],['pointercancel','up']].forEach(([ev,t])=>cv.addEventListener(ev,e=>{
  if(!G||state!=='play'||!G.pointer)return;
  if(t==='down'){e.preventDefault();try{cv.setPointerCapture(e.pointerId);}catch(_){}}
  const[x,y]=gpos(e);G.pointer(t,x,y,e);
}));
cv.addEventListener('contextmenu',e=>e.preventDefault());

const BLOCK=['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];
addEventListener('keydown',e=>{
  if(!G)return;
  if(e.code==='Escape'){toMenu();return;}
  if(BLOCK.includes(e.code))e.preventDefault();
  if(state!=='play'){if(!e.repeat&&(e.code==='Space'||e.code==='Enter')){e.preventDefault();startPlay();}return;}
  if(G.key)G.key(e.code,true,e.repeat);
});
addEventListener('keyup',e=>{if(G&&state==='play'&&G.key)G.key(e.code,false,false);});
addEventListener('blur',()=>{if(G&&G.key)['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','KeyA','KeyD','KeyW','KeyS','Space'].forEach(k=>G.key(k,false,false));});

function buildPad(){
  const p=$('#pad');p.innerHTML='';p.classList.toggle('has',!!G.pad);
  (G.pad||[]).forEach(([lab,code])=>{
    const b=document.createElement('button');b.type='button';b.textContent=lab;let iv=null;
    const up=()=>{if(iv){clearInterval(iv);iv=null;if(G&&state==='play'&&G.key)G.key(code,false,false);}};
    b.addEventListener('pointerdown',e=>{
      e.preventDefault();if(!G)return;
      if(state!=='play'){startPlay();return;}
      G.key(code,true,false);let n=0;clearInterval(iv);
      iv=setInterval(()=>{if(G&&state==='play'&&++n>2)G.key(code,true,true);},70);
    });
    ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,up));
    b.addEventListener('contextmenu',e=>e.preventDefault());
    p.appendChild(b);
  });
}

function fit(){
  if(!G)return;
  const top=$('#stage').getBoundingClientRect().top;
  const below=$('#pad').offsetHeight+$('#help').offsetHeight+44;
  const aw=Math.min(innerWidth-32,1000),ah=Math.max(220,innerHeight-top-below);
  const s=Math.min(aw/G.vw,ah/G.vh);
  cv.style.width=Math.floor(G.vw*s)+'px';cv.style.height=Math.floor(G.vh*s)+'px';
}
addEventListener('resize',fit);
if(matchMedia('(pointer:coarse)').matches)document.body.classList.add('touch');
addEventListener('touchstart',()=>{if(!document.body.classList.contains('touch')){document.body.classList.add('touch');fit();}},{passive:true});

/* ---------- メニュー（検索・ジャンル絞り込み） ---------- */
let fGenre='すべて',fQuery='';
// カタカナ→ひらがな・小文字化して表記ゆれを吸収
const norm=s=>s.toLowerCase().normalize('NFKC').replace(/[ァ-ヶ]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0x60));
function visibleGames(){
  const words=norm(fQuery).split(/\s+/).filter(Boolean);
  return GAMES.map((x,i)=>({x,i})).filter(({x})=>{
    if(fGenre!=='すべて'&&x.tag!==fGenre)return false;
    const hay=norm(x.name+' '+x.desc+' '+x.tag+' '+x.help);
    return words.every(w=>hay.includes(w));
  });
}
function buildFilters(){
  const box=$('#chips');box.innerHTML='';
  ['すべて',...new Set(GAMES.map(g=>g.tag))].forEach(g=>{
    const n=g==='すべて'?GAMES.length:GAMES.filter(x=>x.tag===g).length;
    const b=document.createElement('button');b.type='button';b.className='chip'+(g===fGenre?' on':'');
    b.setAttribute('aria-pressed',g===fGenre);b.innerHTML=`${g}<span>${n}</span>`;
    b.onclick=()=>{fGenre=g;buildFilters();renderMenu();};box.appendChild(b);
  });
}
function renderMenu(){
  const list=$('#list');list.innerHTML='';
  const vis=visibleGames();
  vis.forEach(({x,i},k)=>{
    const b=document.createElement('button');b.type='button';b.className='row';
    b.style.setProperty('--c1',x.color[0]);b.style.setProperty('--c2',x.color[1]);b.style.animationDelay=(k*30)+'ms';
    b.innerHTML=`<span class="no">${String(i+1).padStart(2,'0')}</span><span class="emo">${x.emoji}</span>`+
      `<span class="txt"><span class="nm">${x.name}<span class="tag">${x.tag}</span></span><span class="ds">${x.desc}</span></span>`+
      `<span class="bs"><small>ベスト</small>${store.get('gtoku_best_'+x.id)}</span><span class="go">›</span>`;
    b.onclick=()=>openGame(x.id);list.appendChild(b);
  });
  $('#empty').hidden=vis.length>0;
  $('#count').textContent=(fGenre==='すべて'&&!fQuery.trim())?`全${GAMES.length}本`:`${vis.length}件 / 全${GAMES.length}本`;
}
$('#q').addEventListener('input',e=>{fQuery=e.target.value;renderMenu();});
$('#q').addEventListener('keydown',e=>{
  if(e.key==='Enter'){const v=visibleGames();if(v.length===1)openGame(v[0].x.id);}
  else if(e.key==='Escape'){e.target.value='';fQuery='';renderMenu();e.target.blur();}
});
$('#clear').onclick=()=>{fQuery='';fGenre='すべて';$('#q').value='';buildFilters();renderMenu();};
addEventListener('keydown',e=>{if(!G&&e.key==='/'&&document.activeElement!==$('#q')){e.preventDefault();$('#q').focus();}});
// 同じフォルダの追加ゲームを読み込んでからメニューを作る
addEventListener('DOMContentLoaded',()=>{
  $('header p').textContent=`ブラウザですぐ遊べる ${GAMES.length}本のミニゲーム詰め合わせ`;
  buildFilters();renderMenu();
});

let last=performance.now();
function loop(t){
  const dt=Math.min(.033,Math.max(0,(t-last)/1000));last=t;
  if(G){if(state==='play'&&G.update)G.update(dt);ctx.save();drawGame(ctx);ctx.restore();}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
